# The local cluster. Pomerium and Dex are NodePort Services (deploy/local),
# published on the Mac's loopback: https://*.localtest.me (which resolves to
# 127.0.0.1) and http://localhost:5556.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
      - containerPort: 30556
        hostPort: 5556
        listenAddress: 127.0.0.1
