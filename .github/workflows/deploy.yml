name: deploy

# Applies deploy/gke to the production cluster. Started by hand only.
#
# The human gate is the procedure, not a GitHub feature (this repository's
# plan has no environment protection rules), as for "infra apply":
#   1. the manifests and the pinned image digests are reviewed in a pull
#      request and merged to main,
#   2. start this workflow on main and type "deploy".
# The procedure and what to check when a step fails: docs/gke-deployment.md.
#
# Authentication is keyless: GitHub's OIDC token is exchanged through Workload
# Identity Federation for the deployer service account (Kubernetes Engine
# Admin), which Google only hands to workflows running on refs/heads/main of
# this repository. The cluster is reached through its DNS-based endpoint,
# which is authorised by that identity and needs no network allow-list.
#
# Secrets. The Google and GitHub OAuth apps' credentials are the repository
# secrets DEX_GOOGLE_CLIENT_ID, DEX_GOOGLE_CLIENT_SECRET, DEX_GITHUB_CLIENT_ID
# and DEX_GITHUB_CLIENT_SECRET; every run writes them to the dex-oauth Secret.
# Pomerium's own secrets are generated in the cluster's first run and never
# again: new ones would sign everybody out.
#
# Billing (docs/billing-deployment.md). The repository VARIABLE STRIPE_MODE is
# test, live or not set. Not set, no Stripe secret is needed or looked at.
# Set, that mode's key (STRIPE_TEST_API_KEY or STRIPE_LIVE_API_KEY) must be
# set, and the cluster must already have the Secret stripe-webhook of that
# mode, which the "billing apply" workflow writes (docs/billing-iac.md).
# Metronome's two secrets are needed once billing is not off in deploy/gke
# (hack/billing-stage.sh): METRONOME_SANDBOX_API_TOKEN and
# METRONOME_SANDBOX_WEBHOOK_SECRET, or the METRONOME_PRODUCTION_ pair when
# STRIPE_MODE is live. A missing one stops the run before it touches the
# cluster.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to change the production cluster
        required: true
        type: string
      issuer:
        description: Where the certificate comes from (staging is untrusted; for testing issuance)
        required: true
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

# One at a time, in order; a queued run is never cancelled half way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLUSTER: browserjs
  CLUSTER_LOCATION: us-west1-a
  NS: browserjs-sessions
  EDGE_IP: 8.231.155.139
  KUBECTL_VERSION: v1.36.5

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    # Shorter than the hour the cluster credentials last.
    timeout-minutes: 50
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse unless confirmed and on main
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::deploy runs only on refs/heads/main, not $REF"
            exit 1
          fi
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm must be exactly: deploy"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Images are pinned
        run: hack/pin-images.sh --check

      # off, serving or enforcing, and that the files agree on which.
      - name: Session policy stage
        run: hack/policy-stage.sh --check

      # off, meter or enforce, and that the files agree on which; that the
      # stage can go with STRIPE_MODE; and that the secrets the stage and
      # the mode need are set.
      - name: Billing stage and secrets
        env:
          STRIPE_MODE: ${{ vars.STRIPE_MODE }}
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          METRONOME_SANDBOX_API_TOKEN: ${{ secrets.METRONOME_SANDBOX_API_TOKEN }}
          METRONOME_SANDBOX_WEBHOOK_SECRET: ${{ secrets.METRONOME_SANDBOX_WEBHOOK_SECRET }}
          METRONOME_PRODUCTION_API_TOKEN: ${{ secrets.METRONOME_PRODUCTION_API_TOKEN }}
          METRONOME_PRODUCTION_WEBHOOK_SECRET: ${{ secrets.METRONOME_PRODUCTION_WEBHOOK_SECRET }}
        run: |
          hack/billing-stage.sh --check
          hack/billing-secrets.sh --check

      - name: OAuth secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.DEX_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.DEX_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.DEX_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DEX_GITHUB_CLIENT_SECRET }}
        run: |
          missing=""
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret DEX_$name is not set"
              missing=1
            fi
          done
          [ -z "$missing" ]

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          use_dns_based_endpoint: "true"

      # Kubernetes Engine Admin already allows everything below through IAM.
      # The binding makes the same true in the cluster's own RBAC, so that
      # nothing here depends on how GKE maps an IAM role onto a kind it has
      # no named permission for (ValidatingAdmissionPolicy, custom resources).
      - name: The deployer is cluster-admin
        env:
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
        run: |
          kubectl version
          kubectl create clusterrolebinding browserjs-deployer --clusterrole=cluster-admin \
            --user="$DEPLOY_SA" --dry-run=client -o yaml | kubectl apply -f -

      - name: Sandbox API the cluster serves
        id: sandbox_api
        run: |
          served="$(kubectl get crd sandboxes.agents.x-k8s.io \
            -o jsonpath='{range .spec.versions[?(@.served==true)]}{.name}{" "}{end}' || true)"
          echo "sandboxes.agents.x-k8s.io serves: ${served:-nothing (the CRD is missing)}"
          if grep -qw v1beta1 <<<"$served"; then
            echo "v1beta1=true" >> "$GITHUB_OUTPUT"
          else
            echo "v1beta1=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The cluster does not serve agents.x-k8s.io/v1beta1 (it serves: ${served:-nothing}). Sessions cannot work until the control plane is GKE 1.36.3-gke.1767000 or later. Carrying on with the rest; the run fails at the end."
          fi

      # Server-side: the CRDs are too large for the annotation client-side
      # apply keeps.
      - name: cert-manager
        run: |
          kubectl apply --server-side --force-conflicts -k deploy/gke/cert-manager
          for deployment in cert-manager cert-manager-cainjector cert-manager-webhook; do
            kubectl -n cert-manager rollout status "deployment/$deployment" --timeout=300s
          done
          # Ready pods are not yet a webhook the API server can call: the CA
          # is injected a little later.
          for attempt in $(seq 1 30); do
            if kubectl apply --dry-run=server -f deploy/gke/issuers.yaml; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::cert-manager's webhook did not answer after 5 minutes"
              exit 1
            fi
            sleep 10
          done

      - name: Issuers
        env:
          ISSUER: ${{ inputs.issuer }}
        run: |
          kubectl apply -f deploy/gke/issuers.yaml
          # Ready once the account is registered with Let's Encrypt.
          kubectl wait --for=condition=Ready "clusterissuer/letsencrypt-$ISSUER" --timeout=180s

      - name: Secrets
        id: secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.DEX_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.DEX_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.DEX_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DEX_GITHUB_CLIENT_SECRET }}
        run: |
          kubectl apply -f deploy/base/namespace.yaml

          # Values go to kubectl on stdin, so they are never in a command
          # line, a file or this log.
          secret_from_stdin() { # name; reads KEY=value lines
            kubectl -n "$NS" create secret generic "$1" --from-env-file=/dev/stdin --dry-run=client -o yaml |
              kubectl apply -f - >/dev/null
            echo "secret/$1 applied"
          }
          random_b64() { head -c 32 /dev/urandom | base64 -w0; }

          # Pomerium's own secrets are made once. New ones would sign every
          # user and every MCP client out, so they are never replaced here.
          if kubectl -n "$NS" get secret pomerium >/dev/null 2>&1; then
            echo "secret/pomerium exists: left alone"
          else
            {
              echo "SHARED_SECRET=$(random_b64)"
              echo "COOKIE_SECRET=$(random_b64)"
              echo "SIGNING_KEY=$(openssl ecparam -genkey -name prime256v1 -noout | base64 -w0)"
              echo "IDP_CLIENT_SECRET=$(random_b64 | tr -d '/+=')"
            } | secret_from_stdin pomerium
          fi

          # Session policies: the tokens OPA, the policy operator and the
          # backend know each other by (docs/contracts/policy/deploy.md).
          # Made once, like Pomerium's; all three read them at startup.
          random_b64url() { head -c 32 /dev/urandom | base64 -w0 | tr '+/' '-_' | tr -d '='; }
          if kubectl -n "$NS" get secret policy-tokens >/dev/null 2>&1; then
            echo "secret/policy-tokens exists: left alone"
          else
            {
              echo "bundle-token=$(random_b64url)"
              echo "opa-token=$(random_b64url)"
              echo "operator-api-token=$(random_b64url)"
            } | secret_from_stdin policy-tokens
          fi

          # API tokens: the key that signs the access tokens they are
          # exchanged for (docs/api-tokens.md). Made once: a new one ends
          # every access token in use, an hour's worth at most.
          if kubectl -n "$NS" get secret api-tokens >/dev/null 2>&1; then
            echo "secret/api-tokens exists: left alone"
          else
            echo "signing-key=$(random_b64)" | secret_from_stdin api-tokens
          fi

          # Dex and Pomerium share the secret of Dex's one client.
          client_secret="$(kubectl -n "$NS" get secret pomerium -o jsonpath='{.data.IDP_CLIENT_SECRET}' | base64 -d)"
          echo "::add-mask::$client_secret"
          [ -n "$client_secret" ] || { echo "::error::secret/pomerium has no IDP_CLIENT_SECRET"; exit 1; }

          version() { kubectl -n "$NS" get secret dex-oauth -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null || true; }
          before="$(version)"
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID"
            echo "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET"
            echo "POMERIUM_CLIENT_SECRET=$client_secret"
          } | secret_from_stdin dex-oauth
          unset client_secret
          # Dex reads the Secret at startup only.
          if [ -n "$before" ] && [ "$before" != "$(version)" ]; then
            echo "dex_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Stripe's mode and keys, together: the Secret "stripe" and the
      # ConfigMap "billing-mode", or neither while STRIPE_MODE is not set.
      # Metronome's: the Secret "metronome", or none while billing is off.
      - name: Billing secrets
        id: billing
        env:
          STRIPE_MODE: ${{ vars.STRIPE_MODE }}
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          METRONOME_SANDBOX_API_TOKEN: ${{ secrets.METRONOME_SANDBOX_API_TOKEN }}
          METRONOME_SANDBOX_WEBHOOK_SECRET: ${{ secrets.METRONOME_SANDBOX_WEBHOOK_SECRET }}
          METRONOME_PRODUCTION_API_TOKEN: ${{ secrets.METRONOME_PRODUCTION_API_TOKEN }}
          METRONOME_PRODUCTION_WEBHOOK_SECRET: ${{ secrets.METRONOME_PRODUCTION_WEBHOOK_SECRET }}
        run: hack/billing-secrets.sh

      - name: Apply
        env:
          ISSUER: ${{ inputs.issuer }}
        run: |
          overlay=deploy/gke
          [ "$ISSUER" = production ] || overlay=deploy/gke-staging-issuer
          kubectl apply -k "$overlay"
          # The policy operator looks its resource up once, when it starts.
          kubectl wait --for=condition=Established --timeout=60s \
            crd/sessionpolicies.browserjs.dev crd/apitokens.browserjs.dev \
            crd/accounts.browserjs.dev

      - name: Certificate
        run: |
          # DNS-01: a TXT record, its propagation, then Let's Encrypt's check.
          if ! kubectl -n "$NS" wait --for=condition=Ready certificate/pomerium-tls --timeout=15m; then
            echo "::error::the certificate was not issued; see the status below and docs/gke-deployment.md"
            kubectl -n "$NS" describe certificate,certificaterequest,order,challenge || true
            kubectl -n cert-manager logs deployment/cert-manager --tail=100 || true
            exit 1
          fi

      - name: Dex and Pomerium
        id: edge
        env:
          DEX_CHANGED: ${{ steps.secrets.outputs.dex_changed }}
        run: |
          [ "$DEX_CHANGED" != true ] || kubectl -n "$NS" rollout restart deployment/dex
          kubectl -n "$NS" rollout status deployment/dex --timeout=300s
          kubectl -n "$NS" rollout status statefulset/pomerium --timeout=600s

          address=""
          for _ in $(seq 1 60); do
            address="$(kubectl -n "$NS" get service pomerium -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            [ -z "$address" ] || break
            sleep 10
          done
          if [ "$address" != "$EDGE_IP" ]; then
            echo "::error::Pomerium's Service has the address '${address:-none}', not the reserved $EDGE_IP"
            kubectl -n "$NS" describe service pomerium || true
            exit 1
          fi

          # Does Pomerium serve the certificate that is in the Secret now? If
          # not (it was reissued, e.g. staging then production), restart it.
          in_secret() {
            kubectl -n "$NS" get secret pomerium-tls -o jsonpath='{.data.tls\.crt}' | base64 -d |
              openssl x509 -noout -fingerprint -sha256
          }
          served() {
            openssl s_client -connect "$EDGE_IP:443" -servername app.computeruse.site </dev/null 2>/dev/null |
              openssl x509 -noout -fingerprint -sha256 2>/dev/null || true
          }
          want="$(in_secret)"
          have=""
          # A new load balancer takes a minute or two to pass traffic.
          for _ in $(seq 1 30); do
            have="$(served)"
            [ -z "$have" ] || break
            sleep 10
          done
          echo "certificate in the Secret: $want"
          echo "certificate served:        ${have:-nothing answered on $EDGE_IP:443}"
          if [ "$have" != "$want" ]; then
            kubectl -n "$NS" rollout restart statefulset/pomerium
            kubectl -n "$NS" rollout status statefulset/pomerium --timeout=600s
            echo "restarted=true" >> "$GITHUB_OUTPUT"
          fi

      # With session policies off both have no pods, and this passes at once.
      # The operator first: OPA is not ready until it has the operator's
      # bundle.
      - name: Policy operator and OPA
        run: |
          for deployment in policy-operator opa; do
            if ! kubectl -n "$NS" rollout status "deployment/$deployment" --timeout=300s; then
              echo "::error::deployment/$deployment did not become ready; see the status below and docs/policy-deployment.md"
              kubectl -n "$NS" describe "deployment/$deployment" || true
              kubectl -n "$NS" logs "deployment/$deployment" --tail=100 || true
              exit 1
            fi
          done

      # With billing off it has no pods, and this passes at once. It reads
      # its Metronome token at start only.
      - name: Billing operator
        env:
          METRONOME_CHANGED: ${{ steps.billing.outputs.metronome_changed }}
        run: |
          [ "$METRONOME_CHANGED" != true ] || kubectl -n "$NS" rollout restart deployment/billing-operator
          if ! kubectl -n "$NS" rollout status deployment/billing-operator --timeout=300s; then
            echo "::error::deployment/billing-operator did not become ready; see the status below and docs/billing-deployment.md"
            kubectl -n "$NS" describe deployment/billing-operator || true
            kubectl -n "$NS" logs deployment/billing-operator --tail=100 || true
            exit 1
          fi

      - name: Backend
        env:
          ISSUER: ${{ inputs.issuer }}
          POMERIUM_RESTARTED: ${{ steps.edge.outputs.restarted }}
          BILLING_CHANGED: ${{ steps.billing.outputs.stripe_changed == 'true' || steps.billing.outputs.metronome_changed == 'true' }}
        run: |
          # The backend fetches Pomerium's signing keys when it starts, and
          # after a failure only every few minutes. One that started before
          # Pomerium was serving starts again.
          pomerium_ready="$(kubectl -n "$NS" get pod pomerium-0 \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].lastTransitionTime}')"
          backend_started="$(kubectl -n "$NS" get pods -l app=backend \
            -o jsonpath='{.items[0].status.startTime}' 2>/dev/null || true)"
          # It reads Stripe's and Metronome's values at start only, too.
          if [ "$POMERIUM_RESTARTED" = true ] || [ "$BILLING_CHANGED" = true ] || [ -z "$backend_started" ] || [[ "$backend_started" < "$pomerium_ready" ]]; then
            kubectl -n "$NS" rollout restart deployment/backend
          fi
          kubectl -n "$NS" rollout status deployment/backend --timeout=300s
          kubectl -n "$NS" rollout status deployment/site --timeout=300s
          if [ "$ISSUER" = staging ]; then
            echo "::warning::Deployed with a STAGING certificate: nothing trusts it, so sign-in and the backend's key fetch do not work. Run again with issuer=production."
          fi

      - name: Status to job summary
        if: ${{ !cancelled() }}
        env:
          ISSUER: ${{ inputs.issuer }}
        run: |
          {
            echo "## deploy: status afterwards"
            echo
            echo "Commit \`$GITHUB_SHA\`, issuer \`$ISSUER\`."
            echo
            echo '```'
            kubectl kustomize deploy/gke | grep -E '^\s+(- )?image:' | sort -u || true
            grep -E '^\s+image:' deploy/gke/blueprint.yaml || true
            echo '```'
            hack/gke-status.sh
          } > "${RUNNER_TEMP}/status.md" 2>&1 || true
          # A job summary holds at most 1 MiB.
          head -c 900000 "${RUNNER_TEMP}/status.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        env:
          V1BETA1: ${{ steps.sandbox_api.outputs.v1beta1 }}
        run: |
          if [ "$V1BETA1" != true ]; then
            echo "::error::Deployed, but sessions cannot start: the cluster does not serve agents.x-k8s.io/v1beta1. Upgrade the control plane to GKE 1.36.3-gke.1767000 or later (infra/main/terraform.tfvars, kubernetes_version) and run this again."
            exit 1
          fi
