name: web tests

# The web app's checks: types, the vitest suite, and the production build.
# The suite runs against the mock backend (web/mock/), which reads the policy
# contract's examples and schema; nothing here contacts a backend or has a key.

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/contracts/policy/**"
      - ".github/workflows/web-tests.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/contracts/policy/**"
      - ".github/workflows/web-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request replaces the run in progress.
concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
