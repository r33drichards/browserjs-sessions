name: infra apply

# Applies infra/main to Google Cloud when a change to infra/main lands on main,
# and by hand (type "apply") to apply again without a change.
#
# The gate is the pull request: read the plan in its "infra plan" run, then
# merge. The merge is the approval; this workflow plans again, prints that
# plan to the summary, and applies exactly it. Nothing else changes the
# project, so the plan it applies is the plan that was reviewed unless main
# moved in between.
#
# Authentication is keyless: GitHub's OIDC token is exchanged through Workload
# Identity Federation for the tofu-apply service account (project Owner),
# which Google only hands to workflows running on refs/heads/main of this
# repository. No key or token is stored anywhere.

on:
  push:
    branches: [main]
    paths:
      - "infra/main/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "apply" to change the real infrastructure
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# One at a time, in order; a queued run is never cancelled half way.
concurrency:
  group: infra-apply
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.10.7"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}

jobs:
  apply:
    name: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: infra/main
    steps:
      - name: Refuse unless confirmed and on main
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::infra apply runs only on refs/heads/main, not $REF"
            exit 1
          fi
          # A push to main was reviewed as a pull request; a run by hand must say so.
          if [ "$EVENT" != "push" ] && [ "$CONFIRM" != "apply" ]; then
            echo "::error::confirm must be exactly: apply"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive -diff
        working-directory: infra

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TOFU_APPLY_SA }}

      - name: Init
        run: tofu init -backend-config="bucket=${TOFU_STATE_BUCKET}"

      - name: Validate
        run: tofu validate -no-color

      - name: Plan
        run: |
          set -o pipefail
          tofu plan -lock-timeout=5m -no-color -out=tfplan 2>&1 | tee "${RUNNER_TEMP}/plan.txt"

      - name: Plan to job summary
        if: ${{ !cancelled() }}
        run: |
          plan="${RUNNER_TEMP}/plan.txt"
          {
            echo "## infra plan (applied by this run)"
            echo
            if [ -s "$plan" ]; then
              echo '```'
              # A job summary holds at most 1 MiB.
              head -c 900000 "$plan"
              echo
              echo '```'
              if [ "$(wc -c < "$plan")" -gt 900000 ]; then
                echo "_Truncated; the full plan is in the job log._"
              fi
            else
              echo "_No plan was produced; see the job log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: tofu apply -lock-timeout=5m -no-color tfplan

      - name: Outputs to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## infra outputs"
            echo
            echo '```'
            tofu output -no-color || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
