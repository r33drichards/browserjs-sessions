name: session public url

# One-off, for the move from browserjs.com to computeruse.site
# (docs/domain-switch.md). A session made before the move keeps
# https://sessions.browserjs.com/<id> as MCP_V8_PUBLIC_URL in its Sandbox, so
# the upload URLs its mcp-js hands out lead to a host that is no longer
# served. This rewrites that one value to sessions.computeruse.site, in one
# named session or in all of them, and does nothing else
# (hack/session-public-url.sh).
#
# Only sessions stopped by their user are changed; running and sleeping ones
# are listed and skipped. So: stop the session in the UI, run this, resume
# it.
#
# Without the confirmation it only lists what it would change. Started by
# hand, on main only: it signs in as the deployer service account, the one
# identity GitHub Actions has on the cluster. Delete this workflow and the
# script once no session from before the move is left.

on:
  workflow_dispatch:
    inputs:
      session:
        description: A session ID (s-…), or "all" for every session that still has the old host
        required: true
        type: string
      confirm:
        description: Type "patch" to change the Sandboxes; anything else only lists what would change
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

# Never beside a deploy, and one at a time.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLUSTER: browserjs
  CLUSTER_LOCATION: us-west1-a
  KUBECTL_VERSION: v1.36.5

jobs:
  patch:
    name: patch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the inputs
        env:
          REF: ${{ github.ref }}
          SESSION: ${{ inputs.session }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::runs only on refs/heads/main, not $REF (the deployer account is bound to it)"
            exit 1
          fi
          if [ "$SESSION" != all ] && [[ ! "$SESSION" =~ ^s-[a-z0-9]{5,10}$ ]]; then
            echo "::error::session must be a session ID (s-…) or: all"
            exit 1
          fi
          if [ -n "$CONFIRM" ] && [ "$CONFIRM" != patch ]; then
            echo "::error::confirm must be exactly: patch (or empty, to only list)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          use_dns_based_endpoint: "true"

      - name: Rewrite MCP_V8_PUBLIC_URL
        env:
          SESSION: ${{ inputs.session }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -o pipefail
          args=()
          [ "$CONFIRM" != patch ] || args+=(--apply)
          {
            echo "## session public url"
            echo
            echo '```'
            hack/session-public-url.sh "${args[@]}" "$SESSION"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
