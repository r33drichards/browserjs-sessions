name: operators

# The pytest suites of the two operators, each in its own Nix dev shell
# (images/<operator>/flake.nix), as a developer runs them. No cluster, no
# Docker, no secret: local fixtures run Redis, OPA, and pinned MCPJS for
# policy tests; Kubernetes APIs are fakes.

on:
  pull_request:
    paths:
      - "images/billing-operator/**"
      - "images/policy-operator/**"
      # The tests read the contracts' vectors, examples and catalogue.
      - "docs/contracts/billing/**"
      - "docs/contracts/policy/**"
      - ".github/workflows/operators.yml"
  push:
    branches: [main]
    paths:
      - "images/billing-operator/**"
      - "images/policy-operator/**"
      - "docs/contracts/billing/**"
      - "docs/contracts/policy/**"
      - ".github/workflows/operators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest ${{ matrix.operator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        operator: [billing-operator, policy-operator]
    defaults:
      run:
        shell: bash
        working-directory: images/${{ matrix.operator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Pinned MCPJS for native-hook integration tests
        if: matrix.operator == 'policy-operator'
        run: |
          binary="$RUNNER_TEMP/mcp-v8"
          curl --fail --location --retry 3 --output "$binary" \
            https://github.com/r33drichards/mcp-js/releases/download/v0.21.0-rc.4/mcp-v8-linux
          echo "ad6808520def87c724e652b68f69b1d403abfb88b99354ef3e5af2e22916ccc2  $binary" | sha256sum --check
          chmod +x "$binary"
          echo "MCPJS_BIN=$binary" >> "$GITHUB_ENV"

      - name: Test
        run: nix develop -c pytest
