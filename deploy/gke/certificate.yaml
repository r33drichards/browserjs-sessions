# One certificate for every public name, kept in the Secret Pomerium mounts
# at /tls. The issuers are in issuers.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pomerium-tls
spec:
  # The Secret Pomerium mounts at /tls.
  secretName: pomerium-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    # The public site (site/), on the domain itself.
    - computeruse.site
    - app.computeruse.site
    - api.computeruse.site
    - authenticate.computeruse.site
    - dex.computeruse.site
    # Every session is under this one name.
    - sessions.computeruse.site
    # DEPRECATED: the host each session had before. Remove it with the
    # legacy-session-* routes in pomerium-config.yaml.
    - "*.sessions.computeruse.site"
  privateKey:
    algorithm: ECDSA
    size: 256
    # A new key with each renewal.
    rotationPolicy: Always
