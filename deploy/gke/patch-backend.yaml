apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: PUBLIC_URL
              value: https://app.browserjs.com
            - name: SESSION_URL_TEMPLATE
              value: https://{id}.sessions.browserjs.com
            # Fetched through the public address, with the public
            # certificate. From inside the cluster that address leads
            # straight to Pomerium's Service.
            - name: POMERIUM_JWKS_URL
              value: https://app.browserjs.com/.well-known/pomerium/jwks.json
            - name: ADMIN_EMAILS
              value: rwendt1337@gmail.com
            # An idle session sleeps to a Pod Snapshot and wakes from it
            # (snapshots.yaml). "false" is today's behaviour: every wake is a
            # cold start, with Chromium restoring its tabs from disk.
            - name: SNAPSHOTS
              value: "true"
            # A snapshot not ready by then is abandoned; the session sleeps
            # without one and wakes cold.
            - name: SNAPSHOT_TIMEOUT
              value: 2m
            # A restore not running by then (counted from when the pod has a
            # node) is abandoned: the snapshot is deleted, the session is
            # started cold on any pool. The wait for a session has to cover
            # that second start.
            - name: SNAPSHOT_RESTORE_TIMEOUT
              value: 2m
            - name: READY_TIMEOUT
              value: 5m
