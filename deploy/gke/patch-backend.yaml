apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: PUBLIC_URL
              value: https://app.computeruse.site
            # Every session is under one host, by its ID.
            - name: SESSION_URL_TEMPLATE
              value: https://sessions.computeruse.site/{id}
            # DEPRECATED: the host each session had before. Requests there
            # are still served, for the URLs already handed out. Remove this
            # with the legacy-session-* routes in pomerium-config.yaml.
            - name: LEGACY_SESSION_URL_TEMPLATE
              value: https://{id}.sessions.computeruse.site
            # Fetched through the public address, with the public
            # certificate. From inside the cluster that address leads
            # straight to Pomerium's Service.
            - name: POMERIUM_JWKS_URL
              value: https://app.computeruse.site/.well-known/pomerium/jwks.json
            - name: ADMIN_EMAILS
              value: rwendt1337@gmail.com
            # The API host (the "api" route of pomerium-config.yaml). Naming
            # it makes it the API's alone: nothing of the app is served
            # there. API tokens are OFF: ALLOWED_EMAILS is empty (base), so
            # nobody can make a token and the host refuses every one. To turn
            # them on, add ALLOWED_EMAILS with the addresses of the policy
            # in pomerium-config.yaml (docs/api-tokens.md).
            - name: API_URL
              value: https://api.computeruse.site
            # An idle session sleeps to a Pod Snapshot and wakes from it
            # (snapshots.yaml). "false" is today's behaviour: every wake is a
            # cold start, with Chromium restoring its tabs from disk.
            - name: SNAPSHOTS
              value: "true"
            # A snapshot not ready by then is abandoned; the session sleeps
            # without one and wakes cold.
            - name: SNAPSHOT_TIMEOUT
              value: 2m
            # A restore not running by then (counted from when the pod has a
            # node) is abandoned: the snapshot is deleted, the session is
            # started cold on any pool. The wait for a session has to cover
            # that second start.
            - name: SNAPSHOT_RESTORE_TIMEOUT
              value: 2m
            - name: READY_TIMEOUT
              value: 5m
            # New sessions are taken from the SandboxWarmPool "s"
            # (warmpool.yaml). Remove this to start every session cold.
            - name: WARM_POOL
              value: s
