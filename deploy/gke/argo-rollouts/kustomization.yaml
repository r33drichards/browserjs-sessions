# Argo Rollouts, applied before deploy/gke (which needs its CRDs): the
# controller that releases the backend blue-green and the site as a canary
# (../rollouts.yaml, docs/releases.md). Only the controller: no Argo CD, no
# dashboard, no kubectl plugin.
#
# argo-rollouts.v1.10.0.yaml is the release's install manifest, unmodified:
#   https://github.com/argoproj/argo-rollouts/releases/download/v1.10.0/install.yaml
#   sha256 ca8a1785391026023627c8a12db5422e227d7a7a6ec7c01f99f7d5b1726ed53c
# Kept in the repository for the reasons cert-manager's is (../cert-manager).
# To upgrade: download the new file beside it, change the name here, delete
# the old one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The manifest's ClusterRoleBinding names this namespace.
namespace: argo-rollouts

resources:
  - namespace.yaml
  - argo-rollouts.v1.10.0.yaml

patches:
  # The system pool has one small node: say what the controller takes of it.
  - target:
      kind: Deployment
      name: argo-rollouts
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 25m
          memory: 96Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
