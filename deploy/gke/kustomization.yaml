# Production, on the GKE cluster infra/main makes: the app on
# app.computeruse.site, sessions on sessions.computeruse.site/<id>, Pomerium on the
# reserved address behind a passthrough load balancer, certificates from
# Let's Encrypt. Applied by .github/workflows/deploy.yml; the procedure is
# docs/gke-deployment.md.
#
# cert-manager itself is cert-manager/, applied first. The Secrets (dex-oauth,
# pomerium) are made by the workflow and are never in the repository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: browserjs-sessions

resources:
  - ../base
  - session.yaml
  - snapshots.yaml
  - warmpool.yaml
  - certificate.yaml
  - site.yaml
  # The Accounts' daily backup; suspended until billing is enforced.
  - billing-export.yaml

# THE ONE PLACE the deployed images are chosen. Each digest is what the
# "images" workflow printed in its run summary for the commit to deploy.
# After editing, run hack/pin-images.sh: the two session images are named
# inside blueprint.yaml (a file in a ConfigMap, which kustomize cannot edit)
# and warmpool.yaml (a custom resource, which it does not edit either), and
# the script copies them there. The deploy workflow refuses to run while a
# REPLACE_ placeholder is left or the files disagree.
images:
  # Not pinned yet. hack/pin-images.sh accepts the placeholder only while
  # session policies are off (patch-policy-off.yaml, below), when the
  # operator has no pods.
  - name: browserjs/policy-operator
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/policy-operator
    digest: sha256:b5885373ff01fdcc855d086cbbb62c4ce0297040d4aa63c3d123661b8dfbd481
  # Not pinned yet. hack/pin-images.sh accepts the placeholder only while
  # billing is off (hack/billing-stage.sh), when the operator has no pods.
  - name: browserjs/billing-operator
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/billing-operator
    digest: REPLACE_WITH_DIGEST
  - name: browserjs/backend
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/backend
    digest: sha256:055c019475d6d4f89ca8a7806018db632491b1052b88f553c3575c23c4b868da
  - name: browserjs/browser
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/browser
    digest: sha256:63145f8083996b55793f6d7b91a819e72ac70c4f8925689a4ec70e4cdad47367
  - name: browserjs/mcp-js
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/mcp-js
    digest: sha256:de903a1b46c19e9130292317b75487f524a78cb3cd373597cde203f8d6be9e9e
  - name: browserjs/site
    newName: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/site
    digest: sha256:5fbef9c6bf8142baca0e9c7c62ee19aba810a7c8aeebf31bc8fd68065b584742

configMapGenerator:
  - name: session-blueprint
    behavior: replace
    files:
      - blueprint.yaml
  - name: pomerium-config
    behavior: replace
    files:
      - config.yaml=pomerium-config.yaml
  - name: dex-config
    behavior: replace
    files:
      - config.yaml=dex-config.yaml

patches:
  - path: patch-backend.yaml
  - path: patch-pomerium.yaml
  # Pomerium's disk (sessions, MCP client registrations, MCP refresh tokens):
  # a zonal Persistent Disk that outlives the pod. A StatefulSet's claim
  # template cannot be changed once it exists.
  - target:
      kind: StatefulSet
      name: pomerium
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: browserjs-zonal
  # The stage of billing: off with neither line, meter (shadow) with the
  # first, enforce with both. Switched by hack/billing-stage.sh
  # (docs/billing-deployment.md).
  # - path: patch-billing-meter.yaml
  # - path: patch-billing-enforce.yaml
  # The stage of session policies: off with both lines, serving with the
  # second only, enforcing with neither. They are the last patches, and are
  # switched by hack/policy-stage.sh (docs/policy-deployment.md).
  # - path: patch-policy-off.yaml
  # - path: patch-policy-backend-off.yaml
