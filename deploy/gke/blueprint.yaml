# deploy/base/blueprint.yaml for GKE: gVisor nodes, the session
# ServiceAccount, the images from the registry, and what Agent Sandbox's
# admission policies ask for. Keep the rest in step with base.
#
# The two image lines are written by hack/pin-images.sh from the images:
# block of kustomization.yaml; do not edit them here.
#
# The spec of a session's Sandbox (agents.x-k8s.io/v1beta1), rendered by the
# backend for each new session: {{ .ID }} is the session's ID, {{ .SessionURL }}
# its own base URL, {{ .PublicURL }} the app's. The backend adds operatingMode
# and the owner label.
podTemplate:
  metadata:
    labels:
      app: browserjs-session
  spec:
    # The managed add-on's sandbox-core-policy requires gVisor; the label and
    # taint are what GKE puts on the sessions node pool.
    runtimeClassName: gvisor
    nodeSelector:
      sandbox.gke.io/runtime: gvisor
    tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
    serviceAccountName: session
    automountServiceAccountToken: false
    enableServiceLinks: false
    # Chromium only saves its tabs on a clean exit: the browser's entrypoint
    # asks it to quit and waits up to 10 s before stopping the rest.
    terminationGracePeriodSeconds: 30
    securityContext:
      # mcp-js runs as uid/gid 1000 and writes to the session disk.
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      # Nothing in a session runs as root: sandbox-hardening-policy requires
      # it. uid 1000 is "browser" in the browser image and "mcpuser" in
      # mcp-js; the session disk is group-writable for gid 1000 (fsGroup).
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      # No seccompProfile: GKE Sandbox does not support seccomp (gVisor is
      # the system call filter), and the policies do not ask for one.
    containers:
      - name: browser
        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/browser@sha256:0d9862ca0e421ad29b3fce8c4a44cf67e4ac9316e5ed32759e3d0e2401529a24
        env:
          - name: SESSION_MODE
            value: "1"
          - name: DATA_DIR
            value: /data
          - name: TAB_STATE_FILE
            value: /data/chrome/browserjs-tabs.json
        ports:
          - name: vnc
            containerPort: 6080
          - name: browser-mcp
            containerPort: 8081
        # The image has no shell tools to exec; both probes are HTTP.
        startupProbe:
          httpGet:
            path: /healthz
            port: browser-mcp
          periodSeconds: 1
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /healthz
            port: browser-mcp
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        # No capabilities and no way to gain any. Chromium runs with
        # --no-sandbox; gVisor is the sandbox.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: data
            mountPath: /data/chrome
            subPath: chrome
          - name: shm
            mountPath: /dev/shm
      - name: mcp-js
        image: us-west1-docker.pkg.dev/browserjs-sessions/browserjs/mcp-js@sha256:984dceedf06bf2e18473807617bbc491b409b4fe43e1cea93865128719c0cf3b
        env:
          # One-time upload URLs are made from this, so they come back
          # through the session's own host.
          - name: MCP_V8_PUBLIC_URL
            value: "{{ .SessionURL }}"
        ports:
          - name: mcp
            containerPort: 8080
        startupProbe:
          httpGet:
            path: /api/artifacts
            port: mcp
          periodSeconds: 1
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /api/artifacts
            port: mcp
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: data
            mountPath: /data/memory
            subPath: memory
          - name: data
            mountPath: /data/mcp
            subPath: mcp
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: browserjs-zonal
      resources:
        requests:
          storage: 5Gi
