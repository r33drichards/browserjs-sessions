# Pomerium's configuration for production (computeruse.site). Secrets
# (SHARED_SECRET, COOKIE_SECRET, SIGNING_KEY, IDP_CLIENT_SECRET) come from
# the environment.
address: :8443
health_check_addr: 0.0.0.0:28080
certificate_file: /tls/tls.crt
certificate_key_file: /tls/tls.key

authenticate_service_url: https://authenticate.computeruse.site

# Users sign in with Dex, which offers Google and GitHub. Pomerium itself
# fetches this address (discovery, tokens), through its own public name.
idp_provider: oidc
idp_provider_url: https://dex.computeruse.site/dex
idp_client_id: pomerium

# Sessions, MCP client registrations and MCP refresh tokens: lose these and
# every user and every MCP client has to sign in again.
databroker_storage_type: file
databroker_storage_connection_string: file:///data/databroker

# MCP clients that identify themselves by a metadata document under these
# domains may sign users in (Claude's apps and Claude Code).
mcp_allowed_client_id_domains:
  - claude.ai

# The whole of a request must arrive within this: an upload is up to 16 MiB.
timeout_read: 5m

routes:
  # Sessions: one host for all of them, each under its ID
  # (https://sessions.computeruse.site/<id>/...). The backend tells the sessions'
  # host from the app's by Host, so every route keeps the caller's, and the
  # session by the first segment of the path. Each route matches whole
  # paths; nothing else on this host reaches the backend.

  # mcp-js's one-time upload URL: the token in the path is the credential,
  # checked by the session's pod.
  - name: session-upload
    from: https://sessions.computeruse.site
    regex: '^/s-[a-z0-9]+/api/artifact-uploads/[0-9a-f]+$'
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true
    timeout: 5m

  # The session's screen, a websocket: the ticket in the query is the
  # credential, checked by the backend.
  - name: session-vnc
    from: https://sessions.computeruse.site
    regex: '^/s-[a-z0-9]+/vnc$'
    to: http://backend
    allow_public_unauthenticated_access: true
    allow_websockets: true
    preserve_host_header: true

  # The session's MCP endpoint. Pomerium signs the MCP client's user in and
  # says who it is; the backend decides whether the session is theirs. The
  # list of who may sign in is shared with the app's route below.
  #
  # Because this host is exact (no wildcard), Pomerium also answers the
  # OAuth discovery for it: /.well-known/oauth-authorization-server, and
  # /.well-known/oauth-protected-resource/<id>/mcp, which names
  # https://sessions.computeruse.site/<id>/mcp as the resource. Its 401 points an
  # MCP client there.
  - name: session-mcp
    from: https://sessions.computeruse.site
    regex: '^/s-[a-z0-9]+/mcp(/.*)?$'
    to: http://backend
    mcp:
      server:
        max_request_bytes: 1048576
    # Who may use the app at all: these email addresses, nobody else.
    policy: &allowed
      - allow:
          or:
            - email:
                is: rwendt1337@gmail.com
            - email:
                is: browserjs06@gmail.com
    pass_identity_headers: true
    preserve_host_header: true

  # DEPRECATED: a host per session (https://<id>.sessions.computeruse.site/...),
  # where sessions were before. Kept so that the MCP URLs and upload URLs
  # already handed out go on working; no new URL leads here. To retire them,
  # delete these four routes, LEGACY_SESSION_URL_TEMPLATE on the backend,
  # backend/internal/proxy/metadata.go, and the wildcard name from the
  # certificate and from DNS (docs/gke-deployment.md, "Session URLs").

  - name: legacy-session-upload
    from: https://*.sessions.computeruse.site
    prefix: /api/artifact-uploads/
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true
    timeout: 5m

  - name: legacy-session-vnc
    from: https://*.sessions.computeruse.site
    path: /vnc
    to: http://backend
    allow_public_unauthenticated_access: true
    allow_websockets: true
    preserve_host_header: true

  # OAuth discovery for the MCP endpoint. Pomerium v0.33.3 serves these two
  # documents itself only on hosts with an exact route, not on wildcard
  # hosts, so the backend answers them (backend/internal/proxy/metadata.go).
  - name: legacy-session-oauth-metadata
    from: https://*.sessions.computeruse.site
    prefix: /.well-known/oauth-
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true

  - name: legacy-session-mcp
    from: https://*.sessions.computeruse.site
    prefix: /mcp
    to: http://backend
    mcp:
      server:
        max_request_bytes: 1048576
    policy: *allowed
    pass_identity_headers: true
    preserve_host_header: true

  # Dex's own pages (sign-in, the callbacks from Google and GitHub).
  - name: dex
    from: https://dex.computeruse.site
    to: http://dex:5556
    allow_public_unauthenticated_access: true
    preserve_host_header: true

  # The UI and its API.
  - name: app
    from: https://app.computeruse.site
    to: http://backend
    policy: *allowed
    pass_identity_headers: true
    preserve_host_header: true
    # A request may wait for a session's pod to answer.
    timeout: 5m

  # The API host, for clients that cannot sign in (Terraform, scripts, other
  # services). Nobody signs in here and Pomerium says nothing about the
  # caller: the credential is an API token, or an access token made from
  # one, checked by the backend (docs/api-tokens.md). Three routes, each
  # matching whole paths; nothing else on this host reaches the backend.

  # The API.
  - name: api
    from: https://api.computeruse.site
    prefix: /v1/
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true

  # An API token exchanged for an access token (OAuth client credentials).
  - name: api-token
    from: https://api.computeruse.site
    path: /oauth/token
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true

  # A session's MCP endpoint, as on the sessions' host but with a token in
  # place of the sign-in. A call may run for minutes and the event stream
  # for as long as its client keeps it.
  - name: api-mcp
    from: https://api.computeruse.site
    regex: '^/s-[a-z0-9]+/mcp(/.*)?$'
    to: http://backend
    allow_public_unauthenticated_access: true
    preserve_host_header: true
    timeout: 0s
    idle_timeout: 0s
