# The Secrets the deployment expects, with placeholder values. This file is
# not part of the kustomization: create the real ones out of band (locally,
# hack/local-up.sh does, reading the OAuth credentials from the Keychain).
apiVersion: v1
kind: Secret
metadata:
  name: dex-oauth
  namespace: browserjs-sessions
stringData:
  GOOGLE_CLIENT_ID: REPLACE_ME.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: REPLACE_ME
  GITHUB_CLIENT_ID: REPLACE_ME
  GITHUB_CLIENT_SECRET: REPLACE_ME
  # Shared by Dex (its client "pomerium") and Pomerium (IDP_CLIENT_SECRET).
  POMERIUM_CLIENT_SECRET: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: pomerium
  namespace: browserjs-sessions
stringData:
  SHARED_SECRET: REPLACE_ME # head -c32 /dev/urandom | base64
  COOKIE_SECRET: REPLACE_ME # head -c32 /dev/urandom | base64
  # base64 of a PEM EC P-256 private key:
  # openssl ecparam -genkey -name prime256v1 -noout | base64
  SIGNING_KEY: REPLACE_ME
  IDP_CLIENT_SECRET: REPLACE_ME # = POMERIUM_CLIENT_SECRET above
---
# The certificate for the app, authenticate, dex and *.sessions hosts.
apiVersion: v1
kind: Secret
metadata:
  name: pomerium-tls
  namespace: browserjs-sessions
type: kubernetes.io/tls
stringData:
  tls.crt: REPLACE_ME
  tls.key: REPLACE_ME
---
# Session policies: three independent random strings, 32 bytes of base64url
# each (head -c32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=').
apiVersion: v1
kind: Secret
metadata:
  name: policy-tokens
  namespace: browserjs-sessions
stringData:
  bundle-token: REPLACE_ME # OPA fetching the bundle from the operator
  opa-token: REPLACE_ME # the operator reading what each OPA replica has loaded
  operator-api-token: REPLACE_ME # the backend calling validate and evaluate
---
# API tokens: the key that signs the access tokens they are exchanged for
# (docs/api-tokens.md). Optional: without it the backend makes one at each
# start.
apiVersion: v1
kind: Secret
metadata:
  name: api-tokens
  namespace: browserjs-sessions
stringData:
  signing-key: REPLACE_ME # head -c32 /dev/urandom | base64
