apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
---
# The backend holds the only Kubernetes credentials in the system, and they
# reach no further than the session Sandboxes of this namespace and the
# claims on them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # A session taken from a warm pool (WARM_POOL) is asked for with a
  # SandboxClaim, and deleted by deleting it.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "create", "delete"]
  # A session's policy and a user's API tokens are custom resources, and
  # these are all the Role gains: no rule here names configmaps or secrets,
  # which in this namespace would reach Pomerium's and Dex's.
  # sessionpolicies/status is the policy operator's alone.
  - apiGroups: ["browserjs.dev"]
    resources: ["sessionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["browserjs.dev"]
    resources: ["apitokens"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["browserjs.dev"]
    resources: ["apitokens/status"]
    verbs: ["patch"]
  # Billing (docs/contracts/billing/deploy.md). Accounts are the backend's
  # and nobody else's; usage and credit are in Metronome. No watch: there is
  # no informer, every decision reads the Account.
  - apiGroups: ["browserjs.dev"]
    resources: ["accounts"]
    verbs: ["get", "list", "create", "update", "patch"]
  # The observer's heartbeat, to say when metering is stale.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["billing-observer"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend
subjects:
  - kind: ServiceAccount
    name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # Exactly one: VNC tickets and idle tracking live in the process's memory
  # (see backend/cmd/server/main.go). Recreate, so there are never two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: browserjs/backend
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PUBLIC_URL
              value: https://app.example.com
            - name: SESSION_URL_TEMPLATE
              value: https://sessions.example.com/{id}
            # Pomerium serves its signing keys on every host it fronts.
            - name: POMERIUM_JWKS_URL
              value: https://app.example.com/.well-known/pomerium/jwks.json
            - name: ADMIN_EMAILS
              value: ""
            # Session policies. They are off, and the API is as it was,
            # while POLICY_OPERATOR_URL is unset: patch-policy-backend-off.yaml
            # in an overlay removes it (docs/policy-deployment.md).
            - name: POLICY_OPERATOR_URL
              value: http://policy-operator.browserjs-sessions.svc:8080
            - name: OPERATOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: policy-tokens
                  key: operator-api-token
                  # A cluster without the Secret still gets a backend.
                  optional: true
            # API tokens (docs/api-tokens.md), off while either is empty.
            # API_URL is the API host of pomerium-config.yaml's "api" route;
            # ALLOWED_EMAILS is who may use a token, the same addresses as
            # that file's policy.
            - name: API_URL
              value: ""
            - name: ALLOWED_EMAILS
              value: ""
            # Signs the access tokens API tokens are exchanged for: 32 random
            # bytes in base64, in a Secret made at deploy. Without the
            # Secret the backend makes a key at each start, and access
            # tokens (an hour at most) end with the process.
            - name: API_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: api-tokens
                  key: signing-key
                  optional: true
            # Metering and billing (docs/contracts/billing/deploy.md). OFF:
            # BILLING is not set here, and with it unset the backend is as
            # it was before the feature, whatever the variables below say.
            # An overlay's patch-billing-meter.yaml sets it
            # (hack/billing-stage.sh, docs/billing-deployment.md). Two are
            # left to their defaults by not being named: BILLING_EXEMPT_EMAILS
            # (the value of ADMIN_EMAILS) and TERMS_VERSION (none asked).
            - name: BILLING_GRACE
              value: 5m
            - name: BILLING_DRAIN_TIMEOUT
              value: 10m
            # How often the balance pass reads Metronome.
            - name: BILLING_BALANCE_PASS
              value: 5m
            # Metronome: the meter and the credit ledger
            # (docs/contracts/billing/metronome.md). The Secret is written by
            # the deploy workflow whenever billing is not off
            # (hack/billing-secrets.sh); with BILLING set the backend refuses
            # to start without the two.
            - name: METRONOME_URL
              value: https://api.metronome.com
            - name: METRONOME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metronome
                  key: METRONOME_API_TOKEN
                  optional: true
            - name: METRONOME_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: metronome
                  key: METRONOME_WEBHOOK_SECRET
                  optional: true
            - name: MAX_AWAKE_SESSIONS
              value: "10"
            - name: WAKES_PER_HOUR
              value: "30"
            - name: ZERO_BALANCE_DELETE
              value: "off"
            - name: ZERO_BALANCE_DELETE_AFTER
              value: 336h
            - name: SIGNUP_CREDIT
              value: "on"
            - name: AUTO_RECHARGE
              value: "off"
            - name: BILLING_CATALOGUE
              value: /etc/browserjs/catalogue.yaml
            # Stripe. The mode and the two keys are written together by the
            # deploy workflow (hack/billing-secrets.sh), and are absent until
            # the repository variable STRIPE_MODE is set: no checkout, no
            # webhook route.
            - name: STRIPE_MODE
              valueFrom:
                configMapKeyRef:
                  name: billing-mode
                  key: STRIPE_MODE
                  optional: true
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: STRIPE_API_KEY
                  optional: true
            # The signing secret of the webhook endpoint OpenTofu makes
            # (infra/billing): the billing-apply workflow copies it from
            # its state into this Secret. Nobody enters it.
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-webhook
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: OPEN_SIGNUP
              value: "false"
            - name: SIGNUPS_PER_DAY
              value: "200"
            - name: SIGNUPS_PER_IP_PER_DAY
              value: "5"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: blueprint
              mountPath: /etc/browserjs
              readOnly: true
      volumes:
        # One directory, two ConfigMaps: the session blueprint
        # (blueprint.yaml) and the billing catalogue (catalogue.yaml). Whole
        # ConfigMaps, not files by subPath, so a changed catalogue reaches
        # the pod without a restart.
        - name: blueprint
          projected:
            sources:
              - configMap:
                  name: session-blueprint
              - configMap:
                  name: billing-catalogue
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
