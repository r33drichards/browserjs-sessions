apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: PUBLIC_URL
              value: https://app.localtest.me
            - name: SESSION_URL_TEMPLATE
              value: https://sessions.localtest.me/{id}
            # DEPRECATED: the host each session had before, still served
            # (as in deploy/gke, so that the tests here cover it).
            - name: LEGACY_SESSION_URL_TEMPLATE
              value: https://{id}.sessions.localtest.me
            # *.localtest.me is 127.0.0.1 inside the cluster too, so the keys
            # are fetched from Pomerium's Service; its certificate is signed
            # by the throwaway CA hack/local-up.sh makes.
            - name: POMERIUM_JWKS_URL
              value: https://pomerium.browserjs-sessions.svc.cluster.local/.well-known/pomerium/jwks.json
            - name: SSL_CERT_FILE
              value: /etc/local-ca/ca.crt
            - name: ADMIN_EMAILS
              value: admin@example.com
            # API tokens (docs/api-tokens.md). ALLOWED_EMAILS is the policy
            # of pomerium-config.yaml, address for address.
            - name: API_URL
              value: https://api.localtest.me
            - name: ALLOWED_EMAILS
              value: alice@example.com,bob@example.com,admin@example.com,rwendt1337@gmail.com,browserjs06@gmail.com
          volumeMounts:
            - name: local-ca
              mountPath: /etc/local-ca
              readOnly: true
      volumes:
        - name: local-ca
          configMap:
            name: local-ca
