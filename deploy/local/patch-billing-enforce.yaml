# BILLING IS ENFORCED while this patch is listed in kustomization.yaml, after
# patch-billing-meter.yaml (it only changes the value that one sets): no
# card, no session; at zero credit the sessions are drained and put to
# sleep. The backend refuses to start in this stage without STRIPE_MODE.
#
# Switched by hack/billing-stage.sh (docs/billing-deployment.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-operator
spec:
  template:
    spec:
      containers:
        - name: billing-operator
          env:
            - name: BILLING
              value: enforce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: BILLING
              value: enforce
