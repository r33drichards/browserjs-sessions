# Dex for the local cluster. The browser reaches it at localhost:5556, which
# is the callback registered with the Google and GitHub OAuth apps.
issuer: http://localhost:5556/dex

storage:
  type: kubernetes
  config:
    inCluster: true

web:
  http: 0.0.0.0:5556

# Health checks (and metrics), away from the public port.
telemetry:
  http: 0.0.0.0:5558

oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true

staticClients:
  - id: pomerium
    name: browserjs sessions
    secretEnv: POMERIUM_CLIENT_SECRET
    redirectURIs:
      - https://authenticate.localtest.me/oauth2/callback

connectors:
  - type: google
    id: google
    name: Google
    config:
      clientID: $GOOGLE_CLIENT_ID
      clientSecret: $GOOGLE_CLIENT_SECRET
      redirectURI: http://localhost:5556/dex/callback
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: http://localhost:5556/dex/callback

# Test users, for the local cluster only. The password of each is "test".
enablePasswordDB: true
