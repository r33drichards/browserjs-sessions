# The local kind cluster (hack/local-up.sh): the app on app.localtest.me,
# sessions on sessions.localtest.me/<id>, Dex on localhost:5556.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: browserjs-sessions

resources:
  - ../base

images:
  - name: browserjs/backend
    newTag: dev

configMapGenerator:
  - name: session-blueprint
    behavior: replace
    files:
      - blueprint.yaml
  - name: pomerium-config
    behavior: replace
    files:
      - config.yaml=pomerium-config.yaml
  - name: dex-config
    behavior: replace
    files:
      - config.yaml=dex-config.yaml

patches:
  - path: patch-backend.yaml
  - path: patch-pomerium.yaml
  - path: patch-services.yaml
