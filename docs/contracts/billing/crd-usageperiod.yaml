# The closed book of one account's one period: written once by the billing
# operator when the period ends, never changed, kept 13 months. The current
# period is in Account.status.period; this is its copy for the record.
# Contract: docs/contracts/billing/README.md. Track B copies this file to
# deploy/base/crd-usageperiod.yaml unchanged.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usageperiods.browserjs.dev
spec:
  group: browserjs.dev
  scope: Namespaced
  names:
    kind: UsagePeriod
    listKind: UsagePeriodList
    plural: usageperiods
    singular: usageperiod
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Account
          type: string
          jsonPath: .spec.account
        - name: Start
          type: date
          jsonPath: .spec.start
        - name: Plan
          type: string
          jsonPath: .spec.plan
        - name: Awake (s)
          type: integer
          jsonPath: .spec.awakeSeconds
        - name: Charged (µ$)
          type: integer
          jsonPath: .spec.chargedMicros
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          x-kubernetes-validations:
            - rule: self.spec == oldSelf.spec
              message: a closed period is immutable
          properties:
            spec:
              type: object
              required: ["account", "start", "end", "chargedMicros"]
              properties:
                account:
                  type: string
                  pattern: "^acct-[0-9a-f]{32}$"
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                plan:
                  type: string
                planCreditMicros:
                  type: integer
                  format: int64
                awakeSeconds:
                  type: integer
                  format: int64
                diskGBSeconds:
                  type: integer
                  format: int64
                awakeMicros:
                  type: integer
                  format: int64
                diskMicros:
                  type: integer
                  format: int64
                chargedMicros:
                  description: awakeMicros + diskMicros.
                  type: integer
                  format: int64
                overdraftMicros:
                  type: integer
                  format: int64
                bySource:
                  description: chargedMicros by the source of the grant that paid (signup, plan, purchase, admin).
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                days:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                sessions:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
