# One per user of the product: who they are to Stripe, whether they have a
# card, and the ledger of their credit. Created by the backend the first
# time a signed-in user is seen; spec is the backend's, status is the
# billing operator's alone.
# Contract: docs/contracts/billing/README.md. Track B copies this file to
# deploy/base/crd-account.yaml unchanged.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accounts.browserjs.dev
spec:
  group: browserjs.dev
  scope: Namespaced
  names:
    kind: Account
    listKind: AccountList
    plural: accounts
    singular: account
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Card
          type: boolean
          jsonPath: .spec.paymentMethod.present
        - name: Plan
          type: string
          jsonPath: .status.plan
        - name: Level
          type: string
          jsonPath: .status.level
        - name: Balance (µ$)
          type: integer
          jsonPath: .status.balanceMicros
        - name: Period end
          type: date
          jsonPath: .status.period.end
        - name: Observed
          type: date
          jsonPath: .status.meter.observedAt
          priority: 1
        - name: Blocked
          type: string
          jsonPath: .spec.blocked.reason
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          x-kubernetes-validations:
            - rule: self.metadata.name == 'acct-' + self.spec.ownerHash
              message: an Account is named acct-<spec.ownerHash>
          properties:
            spec:
              type: object
              required: ["owner", "ownerHash"]
              x-kubernetes-validations:
                - rule: self.owner == oldSelf.owner && self.ownerHash == oldSelf.ownerHash
                  message: owner and ownerHash cannot be changed
                - rule: "!has(oldSelf.stripeCustomerId) || (has(self.stripeCustomerId) && self.stripeCustomerId == oldSelf.stripeCustomerId)"
                  message: stripeCustomerId cannot be changed once set
                - rule: "!has(oldSelf.signupCredit) || (has(self.signupCredit) && self.signupCredit == oldSelf.signupCredit)"
                  message: the sign-up credit is decided once
              properties:
                owner:
                  description: The user's email address, lower case, as on their sessions (browserjs.dev/owner-id).
                  type: string
                  maxLength: 320
                ownerHash:
                  description: sessions.OwnerLabel(owner), the value of the label browserjs.dev/owner on the user's sessions.
                  type: string
                  pattern: "^[0-9a-f]{32}$"
                stripeCustomerId:
                  description: The Stripe Customer, made the first time the user is sent to Stripe. Absent until then.
                  type: string
                  pattern: "^cus_[A-Za-z0-9]+$"
                paymentMethod:
                  description: >-
                    What the backend last read from Stripe about the customer's
                    saved payment methods. Always written from a fresh list of
                    them, never from an event's payload. Absent, or present
                    false: the account has no card and can create and wake
                    nothing (enforcement.md).
                  type: object
                  required: ["present", "readAt"]
                  properties:
                    present:
                      description: At least one payment method is attached to the customer.
                      type: boolean
                    ids:
                      description: The attached PaymentMethod IDs. A payment_method.detached event names no customer; this list is how its account is found.
                      type: array
                      maxItems: 20
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        pattern: "^pm_[A-Za-z0-9]+$"
                    default:
                      type: string
                    readAt:
                      type: string
                      format: date-time
                    removedAt:
                      description: When present last became false after having been true. Cleared when a card is back.
                      type: string
                      format: date-time
                signupCredit:
                  description: The outcome of the one-time sign-up credit, written when the first card is saved and never again.
                  type: object
                  required: ["state", "at"]
                  properties:
                    state:
                      type: string
                      enum: ["granted", "refused"]
                    reason:
                      description: "For refused: card-used (this card already earned a credit on some account), prepaid, wallet, no-fingerprint."
                      type: string
                      enum: ["card-used", "prepaid", "wallet", "no-fingerprint"]
                    at:
                      type: string
                      format: date-time
                subscription:
                  description: >-
                    What the backend last read from Stripe about the user's one
                    subscription. Absent for a user who never subscribed. Always
                    written from a fresh read of the Subscription.
                  type: object
                  required: ["id", "status", "priceLookupKey"]
                  properties:
                    id:
                      type: string
                      pattern: "^sub_[A-Za-z0-9]+$"
                    status:
                      type: string
                      enum: ["incomplete", "incomplete_expired", "trialing", "active", "past_due", "canceled", "unpaid", "paused"]
                    priceLookupKey:
                      description: The lookup_key of the subscription's one price (catalogue.yaml).
                      type: string
                    currentPeriodStart:
                      type: string
                      format: date-time
                    currentPeriodEnd:
                      type: string
                      format: date-time
                    cancelAt:
                      description: When the subscription ends, if the user cancelled. Absent otherwise.
                      type: string
                      format: date-time
                    readAt:
                      type: string
                      format: date-time
                autoRecharge:
                  description: The user's automatic top-up (stripe.md, "Auto-recharge"). Absent or enabled false, nothing is ever charged without the user at a checkout.
                  type: object
                  required: ["enabled"]
                  properties:
                    enabled:
                      type: boolean
                    thresholdMicros:
                      type: integer
                      format: int64
                      minimum: 0
                    pack:
                      description: The key of a pack in catalogue.yaml.
                      type: string
                    monthlyCapCents:
                      type: integer
                      format: int64
                      minimum: 0
                    agreedAt:
                      description: When the user agreed to off-session charges, with the text shown (ui-states.md).
                      type: string
                      format: date-time
                    month:
                      description: The calendar month (yyyy-mm, UTC) that seq and chargedCents count.
                      type: string
                    seq:
                      description: Automatic charges attempted in that month.
                      type: integer
                    chargedCents:
                      type: integer
                      format: int64
                    last:
                      type: object
                      properties:
                        paymentIntent:
                          type: string
                        status:
                          type: string
                          enum: ["pending", "succeeded", "failed"]
                        at:
                          type: string
                          format: date-time
                    disabledReason:
                      description: Set with enabled false when the backend turned it off.
                      type: string
                      enum: ["payment-failed", "authentication-required", "no-card", "cap-reached"]
                exempt:
                  description: Metered, never refused, never stopped, needs no card. For admins and guests of the house; set by hand or from BILLING_EXEMPT_EMAILS.
                  type: boolean
                blocked:
                  description: Present, the user can do nothing and their sessions are put to sleep. Set by an admin, or by the backend on a dispute.
                  type: object
                  required: ["reason"]
                  properties:
                    reason:
                      type: string
                      enum: ["dispute", "abuse", "admin"]
                    note:
                      type: string
                      maxLength: 256
                    since:
                      type: string
                      format: date-time
                termsAcceptedAt:
                  description: When the user accepted the terms. Absent, the first-run page asks before the card.
                  type: string
                  format: date-time
                termsVersion:
                  type: string
                  maxLength: 32
                deletedAt:
                  description: The user deleted their account. Only owner, ownerHash, signupCredit and this are kept.
                  type: string
                  format: date-time
            status:
              description: Written by the billing operator only, one whole update per tick (metering.md).
              type: object
              properties:
                plan:
                  description: "The key of the catalogue entry that sets the user's limits now: a plan's key, or payg."
                  type: string
                level:
                  description: ok, low (20 % of the plan's monthly credit, or $1, left), exhausted (nothing left).
                  type: string
                  enum: ["ok", "low", "exhausted"]
                balanceMicros:
                  description: Credit the user can still use now, over every live grant, in micro-dollars.
                  type: integer
                  format: int64
                  minimum: 0
                balances:
                  description: balanceMicros by source of grant, with the earliest expiry of each.
                  type: array
                  maxItems: 4
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["source"]
                  items:
                    type: object
                    required: ["source", "micros"]
                    properties:
                      source:
                        type: string
                        enum: ["signup", "plan", "purchase", "admin"]
                      micros:
                        type: integer
                        format: int64
                      expiresAt:
                        type: string
                        format: date-time
                burnMicrosPerHour:
                  description: What the account is being charged per hour as of the last tick (awake sessions and every disk). For "about N hours left".
                  type: integer
                  format: int64
                period:
                  description: The period usage is shown for. A subscriber's is Stripe's billing period; anyone else's the calendar month, UTC.
                  type: object
                  properties:
                    start:
                      type: string
                      format: date-time
                    end:
                      type: string
                      format: date-time
                    planCreditMicros:
                      description: The amount of the period's plan grant; 0 without a plan.
                      type: integer
                      format: int64
                    awakeSeconds:
                      type: integer
                      format: int64
                    diskGBSeconds:
                      type: integer
                      format: int64
                    awakeMicros:
                      type: integer
                      format: int64
                    diskMicros:
                      type: integer
                      format: int64
                    days:
                      description: By UTC day, for the chart. At most 32 entries.
                      type: array
                      maxItems: 32
                      items:
                        type: object
                        required: ["date"]
                        properties:
                          date:
                            type: string
                            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
                          awakeSeconds:
                            type: integer
                            format: int64
                          awakeMicros:
                            type: integer
                            format: int64
                          diskMicros:
                            type: integer
                            format: int64
                    sessions:
                      description: By session, including sessions since deleted. At most 200 entries; the smallest are merged into "other".
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: ["id"]
                        properties:
                          id:
                            type: string
                          awakeSeconds:
                            type: integer
                            format: int64
                          awakeMicros:
                            type: integer
                            format: int64
                          diskMicros:
                            type: integer
                            format: int64
                exhaustedAt:
                  description: When the balance reached zero; absent while there is a balance. The backend's stop (enforcement.md) and the deletion of disks at zero count from it.
                  type: string
                  format: date-time
                overdraftMicros:
                  description: Charges with no grant to cover them (the grace, calls finishing, disks at zero). Counted, never owed.
                  type: integer
                  format: int64
                meter:
                  description: The meter's working state (metering.md). Nothing outside the operator reads it except observedAt.
                  type: object
                  properties:
                    observedAt:
                      description: The time of the last tick. Older than BILLING_STALE_AFTER, the ledger is stale (enforcement.md).
                      type: string
                      format: date-time
                    chargedMicros:
                      description: Everything ever charged to the account.
                      type: integer
                      format: int64
                    carry:
                      description: The remainders of the last tick's two divisions by 3600.
                      type: object
                      properties:
                        awake:
                          type: integer
                        disk:
                          type: integer
                    sessions:
                      description: The account's sessions as of the last tick.
                      type: array
                      maxItems: 200
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: ["id"]
                      items:
                        type: object
                        required: ["id", "lastSeen", "awake"]
                        properties:
                          id:
                            type: string
                          lastSeen:
                            type: string
                            format: date-time
                          awake:
                            type: boolean
                    consumed:
                      description: Micro-dollars taken from each grant that is still live or expired within 35 days. At most 200 entries.
                      type: array
                      maxItems: 200
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: ["grant"]
                      items:
                        type: object
                        required: ["grant", "micros"]
                        properties:
                          grant:
                            type: string
                          micros:
                            type: integer
                            format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["type"]
                  items:
                    type: object
                    required: ["type", "status"]
                    properties:
                      type:
                        description: "Metered: the operator has this account in its ledger. PaymentFailed: the subscription is past_due or unpaid."
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
