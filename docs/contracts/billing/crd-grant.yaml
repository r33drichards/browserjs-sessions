# SUPERSEDED 2026-10-02 by metronome.md: this resource is NOT deployed and
# nothing reads or writes it. Credit is a Metronome credit (metronome.md, "Credit (grants)"); the keys below live on as its uniqueness_key.
# Kept for the record of the first design only.
#
# An amount of credit, in micro-dollars, given to one account: the one-time
# sign-up credit, a plan's credit for one billing period, a pack that was
# bought (at a checkout or by auto-recharge), or an adjustment by an admin. Immutable but for "revoked". Its NAME is derived
# from what caused it, so making it twice is impossible: that is how every
# Stripe event is handled exactly once (stripe.md).
# Contract: docs/contracts/billing/README.md. Track B copies this file to
# deploy/base/crd-grant.yaml unchanged.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: grants.browserjs.dev
spec:
  group: browserjs.dev
  scope: Namespaced
  names:
    kind: Grant
    listKind: GrantList
    plural: grants
    singular: grant
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Account
          type: string
          jsonPath: .spec.account
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Amount (µ$)
          type: integer
          jsonPath: .spec.amountMicros
        - name: Used (µ$)
          type: integer
          jsonPath: .status.consumedMicros
        - name: Expires
          type: date
          jsonPath: .spec.expiresAt
        - name: State
          type: string
          jsonPath: .status.state
        - name: Ref
          type: string
          jsonPath: .spec.ref
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["account", "source", "amountMicros", "validFrom", "key"]
              x-kubernetes-validations:
                - rule: >-
                    self.account == oldSelf.account && self.source == oldSelf.source &&
                    self.amountMicros == oldSelf.amountMicros && self.validFrom == oldSelf.validFrom &&
                    self.key == oldSelf.key &&
                    has(self.expiresAt) == has(oldSelf.expiresAt) &&
                    (!has(self.expiresAt) || self.expiresAt == oldSelf.expiresAt)
                  message: a grant is immutable; it can only be revoked
                - rule: "!has(oldSelf.revoked) || has(self.revoked)"
                  message: a revoked grant stays revoked
                - rule: self.source == 'admin' || has(self.expiresAt)
                  message: only an admin's grant may have no expiry
              properties:
                account:
                  description: The Account's name (acct-<ownerHash>). The label browserjs.dev/owner carries the hash too.
                  type: string
                  pattern: "^acct-[0-9a-f]{32}$"
                source:
                  type: string
                  enum: ["signup", "plan", "purchase", "admin"]
                amountMicros:
                  description: Micro-dollars of credit (1 USD = 1000000).
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 10000000000
                validFrom:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                key:
                  description: >-
                    What caused the grant, the string its name is the hash of
                    (stripe.md, "Grant keys"): signup/<card fingerprint>,
                    plan/<subscription id>/<period start, unix>,
                    purchase/<checkout session id>, recharge/<payment intent id>,
                    admin/<free text>.
                  type: string
                  maxLength: 256
                item:
                  description: The lookup_key of the plan or pack (catalogue.yaml). Absent for signup and admin.
                  type: string
                ref:
                  description: Stripe IDs for a human following the money. Never used for a decision.
                  type: object
                  properties:
                    checkoutSession:
                      type: string
                    paymentIntent:
                      type: string
                    invoice:
                      type: string
                    subscription:
                      type: string
                revoked:
                  description: Present, the grant counts for nothing from now on. What was used of it stays used.
                  type: object
                  required: ["reason", "at"]
                  properties:
                    reason:
                      type: string
                      enum: ["refund", "dispute", "superseded", "admin", "account-deleted"]
                    at:
                      type: string
                      format: date-time
            status:
              description: Written by the billing operator, for people to read; the ledger itself is Account.status.meter.consumed.
              type: object
              properties:
                consumedMicros:
                  type: integer
                  format: int64
                state:
                  type: string
                  enum: ["pending", "active", "used", "expired", "revoked"]
