# The backend's HTTP API additions for metering and billing. A fragment in
# the manner of docs/contracts/policy/backend-api.yaml: paths are under /api
# on the app host (cookie, through Pomerium) and, where marked, under /v1 on
# the API host (API token). None of these routes exists while BILLING is off.
openapi: 3.0.3
info:
  title: computeruse backend, billing additions
  version: 0.1.0
  description: |
    Who may call what:

    - Cookie (the UI): everything except the webhook.
    - API token: `GET /v1/billing` and `GET /v1/billing/usage` only, with
      any scope. Buying, the portal and deleting the account are for a
      person at the UI: a token gets 403 `ui_only`.
    - The webhook is called by Stripe alone, on the API host, and is not
      under /v1.

    The account is always the caller's own. Admins have no route to another
    user's billing; they use kubectl.

    Changes to existing responses, only while BILLING is not off:
    - a session (`GET /api/sessions`, `GET /api/sessions/{id}`) gains
      `stoppedBy` (`user` for a stop, `sleep` for a sleep its user asked
      for, `idle`, `credit`, `payment-method`, `blocked`) when it is asleep
      or stopped, `draining` (billing's reasons) while it is finishing
      calls before such a sleep, and `deleteAfter` (date-time) when it is
      due for deletion;
    - `POST /api/sessions`, `PATCH /api/sessions/{id}`,
      `POST /api/sessions/{id}/wake` and proxied requests can answer with
      the `Error` below (enforcement.md). `POST /api/sessions/{id}/sleep`
      is never refused for billing.
paths:
  /api/billing:
    get:
      summary: The caller's state, credit, plan and limits. Also GET /v1/billing.
      description: |
        Makes the Account if the caller has none (subject to the sign-up
        limits when OPEN_SIGNUP is on). `ledger` is `pending` until the
        operator has written a status, `stale` when it is older than
        BILLING_STALE_AFTER; the numbers are then the last known.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "403":
          description: account_blocked, or sign-ups are paused (signups_paused).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/billing/usage:
    get:
      summary: Usage by day and by session. Also GET /v1/billing/usage.
      parameters:
        - name: period
          in: query
          description: Start of a closed period, as listed in `periods`. Absent, the current period.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The period's usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "404":
          description: No such period.
  /api/billing/catalogue:
    get:
      summary: What can be bought, from catalogue.yaml, enabled items only. Needs no Account.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalogue" }
  /api/billing/checkout:
    post:
      summary: Start a Stripe Checkout, to save a card, subscribe, or buy credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  description: >-
                    A lookupKey of the catalogue (a plan or a pack). Absent:
                    a Checkout in setup mode that saves a card and charges
                    nothing.
                  type: string
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400":
          description: unknown_item (not in the catalogue, or not enabled).
        "403":
          description: ui_only, account_blocked.
        "409":
          description: already_subscribed (a plan was asked for and the account has a subscription; change it with POST /api/billing/subscription).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: stripe_unavailable. Nothing was charged.
        "503":
          description: payments_off (STRIPE_MODE is unset).
  /api/billing/checkout/{id}:
    get:
      summary: What became of a Checkout the caller started; fulfils it if it is paid.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^cs_[A-Za-z0-9_]+$" }
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    description: |
                      `open`: not completed yet. `complete`: the card is
                      saved, or the payment is made and its Grant exists (the
                      credit is in `GET /api/billing` at the next tick).
                      `expired`: abandoned.
                    type: string
                    enum: [open, complete, expired]
                  kind:
                    type: string
                    enum: [setup, plan, purchase]
                  signupCredit:
                    description: For kind setup, what was decided.
                    $ref: "#/components/schemas/SignupCredit"
                  item: { type: string }
        "404":
          description: Not a Checkout of the caller's account.
  /api/billing/portal:
    post:
      summary: Open Stripe's Customer Portal (card, invoices, change or cancel plan).
      responses:
        "200":
          description: Where to send the browser. The link is short-lived.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "409":
          description: no_customer (the account has never bought anything).
        "502":
          description: stripe_unavailable.
  /api/billing/subscription:
    post:
      summary: Change the caller's subscription to another plan, without the portal.
      description: |
        Cookie only, for an account with a subscription that is active. A
        dearer plan is now: a new period starts, charged at once less the
        unused time of the old one, the new plan's credit is granted in
        full and what was left of the old period's is dropped. A cheaper
        plan waits for the end of the period that is paid for. The plan
        the subscription is on drops a change that was waiting. Asked
        twice, it is done once. Cancelling stays in the portal. (Changing
        plan in Stripe's portal is off: docs/billing-iac.md.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { type: string, description: A plan's lookupKey. }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema:
                type: object
                required: [change, item]
                properties:
                  change:
                    description: |
                      `upgraded`: now. `scheduled`: at the period's end.
                      `kept`: already on this plan; a scheduled change, if
                      any, was dropped.
                    type: string
                    enum: [upgraded, scheduled, kept]
                  item: { type: string }
                  effectiveAt: { type: string, format: date-time }
        "400":
          description: unknown_item (not a plan on sale).
        "402":
          description: payment_failed (the card refused the upgrade, or the subscription's last payment failed). The plan is as it was.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: ui_only, account_blocked.
        "409":
          description: not_subscribed (use checkout), subscription_ending (it was cancelled and runs out).
        "502":
          description: stripe_unavailable. Nothing was changed.
  /api/billing/auto-recharge:
    put:
      summary: Turn automatic top-up on or off, and set its pack, threshold and monthly cap.
      description: |
        Cookie only. Turning it on requires `agree: true` (the user saw the
        text of ui-states.md) and a saved card. 404 while AUTO_RECHARGE is
        off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                pack: { type: string, description: A pack's key. }
                thresholdMicros: { type: integer, format: int64 }
                monthlyCapCents: { type: integer, format: int64 }
                agree: { type: boolean }
      responses:
        "200":
          description: The setting as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoRecharge" }
        "400":
          description: unknown_item, a cap above the catalogue's maximum, or enabling without agree.
        "402":
          description: payment_method_required.
  /api/billing/terms:
    post:
      summary: Record that the caller accepts the terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        "204":
          description: Recorded.
        "409":
          description: Not the current version.
  /api/account:
    delete:
      summary: Delete the caller's account and everything in it.
      description: |
        Deletes every session (disk and snapshots), every API token, cancels
        the subscription at once with no refund, detaches every saved
        card, revokes every Grant, and leaves the Account with `deletedAt`
        (and the record that its card has had the sign-up credit). Not undoable. The
        body must repeat the caller's email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The caller's email address. }
      responses:
        "204":
          description: Deleted; the UI signs the user out.
        "400":
          description: confirm does not match.
        "502":
          description: stripe_unavailable; nothing was deleted.
  /stripe/webhook:
    post:
      summary: Stripe's events. API host only. stripe.md says what each does.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Handled, or ignored.
        "400":
          description: Bad signature, too old, or the wrong mode. No body.
        "500":
          description: Could not be handled now; Stripe retries.
  /metronome/webhook:
    post:
      summary: Metronome's notifications. API host only. metronome.md says what each does.
      parameters:
        - name: Metronome-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Metronome-Date
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Handled, or ignored.
        "400":
          description: Bad signature, or too old. No body.
        "500":
          description: Could not be handled now; Metronome retries.
components:
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A sentence for a person. }
        code:
          type: string
          enum: [payment_method_required, out_of_credit, session_limit, awake_limit,
                 at_capacity, rate_limited, metering_unavailable, account_blocked,
                 terms_required, size_not_included, signups_paused, already_subscribed, no_customer,
                 unknown_item, ui_only, stripe_unavailable, payments_off,
                 too_many_cards, auto_recharge_off, not_subscribed, payment_failed,
                 subscription_ending, invalid_request]
        billingUrl: { type: string, format: uri }
        limit: { type: integer, description: The N of session_limit and awake_limit. }
    SignupCredit:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, granted, refused]
        reason:
          type: string
          enum: [card-used, prepaid, wallet, no-fingerprint]
        amountMicros: { type: integer, format: int64 }
    AutoRecharge:
      type: object
      required: [available, enabled]
      properties:
        available: { type: boolean, description: AUTO_RECHARGE is on. }
        enabled: { type: boolean }
        pack: { type: string }
        thresholdMicros: { type: integer, format: int64 }
        monthlyCapCents: { type: integer, format: int64 }
        chargedCents: { type: integer, format: int64, description: Charged automatically this calendar month. }
        lastStatus:
          type: string
          enum: [pending, succeeded, failed]
        disabledReason:
          type: string
          enum: [payment-failed, authentication-required, no-card, cap-reached]
    Billing:
      type: object
      required: [mode, state, ledger, plan, level, balanceMicros, rates, period, limits, payments]
      properties:
        mode:
          type: string
          enum: [meter, enforce]
        state:
          description: enforcement.md, "Account states".
          type: string
          enum: [blocked, exempt, terms, no_card, active]
        ledger:
          type: string
          enum: [ok, pending, stale]
        hasPaymentMethod: { type: boolean }
        card:
          description: The default card, for display. Absent without one.
          type: object
          properties:
            brand: { type: string }
            last4: { type: string }
            expMonth: { type: integer }
            expYear: { type: integer }
        signupCredit: { $ref: "#/components/schemas/SignupCredit" }
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string, description: "payg, or a plan's key" }
            name: { type: string }
            amount: { type: integer, description: US cents a month; absent for payg. }
            creditMicros: { type: integer, format: int64, description: Credit the plan gives each period. }
        subscription:
          description: Absent without one.
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [incomplete, incomplete_expired, trialing, active, past_due, canceled, unpaid, paused]
            renewsAt: { type: string, format: date-time, description: Absent when cancelsAt is set. }
            cancelsAt: { type: string, format: date-time }
        level:
          type: string
          enum: [ok, low, exhausted]
        balanceMicros: { type: integer, format: int64 }
        balances:
          description: The balance by source, in the order it will be used.
          type: array
          items:
            type: object
            required: [source, micros]
            properties:
              source:
                type: string
                enum: [plan, signup, purchase, admin]
              micros: { type: integer, format: int64 }
              expiresAt: { type: string, format: date-time }
        burnMicrosPerHour: { type: integer, format: int64 }
        rates:
          type: object
          required: [awakeMicrosPerHour, diskMicrosPerGBHour, sessionDiskGB]
          properties:
            awakeMicrosPerHour: { type: integer, format: int64 }
            diskMicrosPerGBHour: { type: integer, format: int64 }
            sessionDiskGB: { type: integer }
        exhaustedAt: { type: string, format: date-time }
        sleepAt:
          description: exhaustedAt + BILLING_GRACE, while sessions are still running on no credit.
          type: string
          format: date-time
        deleteAt:
          description: When the account's sessions will be deleted for being at zero, if ZERO_BALANCE_DELETE is on.
          type: string
          format: date-time
        period:
          type: object
          required: [start, end, awakeSeconds, awakeMicros, diskMicros]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            planCreditMicros: { type: integer, format: int64 }
            awakeSeconds: { type: integer, format: int64 }
            awakeMicros: { type: integer, format: int64 }
            diskMicros: { type: integer, format: int64 }
        sizes:
          description: The awake rate of each size of session, small first (its rate is rates.awakeMicrosPerHour).
          type: array
          items: { $ref: "#/components/schemas/SizeRate" }
        limits:
          type: object
          required: [maxSessions, maxAwake, sizes]
          properties:
            maxSessions: { type: integer }
            maxAwake: { type: integer }
            sizes:
              description: The sizes of session the account's plan includes. `small` is always among them.
              type: array
              items: { type: string }
        autoRecharge: { $ref: "#/components/schemas/AutoRecharge" }
        payments:
          description: "`off`: Stripe is not configured. `test`: test mode, the UI says so."
          type: string
          enum: ["off", test, live]
        hasCustomer: { type: boolean, description: Whether the portal can be opened. }
        termsRequired: { type: string, description: The version to accept, when one must be. }
    Usage:
      type: object
      required: [start, end, awakeSeconds, awakeMicros, diskMicros, days, sessions, periods]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        plan: { type: string }
        awakeSeconds: { type: integer, format: int64 }
        awakeMicros: { type: integer, format: int64 }
        diskMicros: { type: integer, format: int64 }
        days:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              awakeSeconds: { type: integer, format: int64 }
              awakeMicros: { type: integer, format: int64 }
              diskMicros: { type: integer, format: int64 }
        sessions:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              name: { type: string, description: Absent for a deleted session. }
              awakeSeconds: { type: integer, format: int64 }
              awakeMicros: { type: integer, format: int64 }
              diskMicros: { type: integer, format: int64 }
        periods:
          description: Starts of the closed periods that can be asked for, newest first.
          type: array
          items: { type: string, format: date-time }
    Catalogue:
      description: catalogue.yaml as the caller may see it (enabled items only, no product IDs).
      type: object
      required: [currency, rates, signupCredit, payg, plans, packs]
      properties:
        currency: { type: string }
        rates:
          type: object
          properties:
            awakeMicrosPerHour: { type: integer, format: int64 }
            diskMicrosPerGBHour: { type: integer, format: int64 }
            sessionDiskGB: { type: integer }
        signupCredit:
          type: object
          properties:
            amountMicros: { type: integer, format: int64 }
            validDays: { type: integer }
        sizes:
          description: The awake rate of each size of session, small first.
          type: array
          items: { $ref: "#/components/schemas/SizeRate" }
        payg:
          type: object
          properties:
            maxSessions: { type: integer }
            maxAwake: { type: integer }
            sizes: { type: array, items: { type: string }, description: The sizes pay as you go includes. }
        plans:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        packs:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    SizeRate:
      type: object
      required: [key, awakeMicrosPerHour]
      properties:
        key: { type: string, description: "`small`, `medium`, `large`." }
        awakeMicrosPerHour: { type: integer, format: int64 }
    Item:
      type: object
      required: [key, name, lookupKey, amount, creditMicros]
      properties:
        key: { type: string }
        name: { type: string }
        lookupKey: { type: string }
        amount: { type: integer, description: US cents. }
        creditMicros: { type: integer, format: int64 }
        maxSessions: { type: integer }
        maxAwake: { type: integer }
        sizes: { type: array, items: { type: string }, description: "Of a plan: the sizes of session it includes, `small` among them." }
        validDays: { type: integer }
