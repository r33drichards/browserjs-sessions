# Configuration of the shared OPA (opa run --server -c this). Verified with
# OPA 1.9.0; see ../../plans/2026-10-02-session-policies-design.md, section 11.
services:
  operator:
    url: http://policy-operator.browserjs-sessions.svc:8080
    credentials:
      bearer:
        token: "${BUNDLE_TOKEN}"
bundles:
  browserjs:
    service: operator
    resource: /bundles/browserjs.tar.gz
    persist: true
    polling:
      # Long polling: the operator holds the request until the bundle changes,
      # so a change is fetched at once. The delays apply between requests and
      # when the operator does not long-poll.
      long_polling_timeout_seconds: 30
      min_delay_seconds: 1
      max_delay_seconds: 2
persistence_directory: /var/opa
# Tool attempts are durably recorded by MCPJS native pre hooks.
# Do not enable asynchronous decision logs as the source of webhook events.
