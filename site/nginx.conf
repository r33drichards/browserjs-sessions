# Serves the built site (/srv/site) on 8080, behind Pomerium, which
# terminates TLS. Included in the image's http block as conf.d/default.conf.
server {
  listen 8080;
  server_name _;
  root /srv/site;

  # Never send a redirect naming this port or host.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # add_header in a location replaces these, so each location repeats them.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Pages: always ask whether there is a newer one.
  add_header Cache-Control no-cache always;

  error_page 404 /404.html;

  # Clean URLs: /guides/files is guides/files.html, /blog/ is blog/index.html.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Named by a hash of their content: a changed file has a new name.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
